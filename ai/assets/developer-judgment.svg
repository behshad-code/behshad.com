<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 760" role="img" aria-labelledby="title desc">
<title id="title">The new developer skill is knowing what to ship</title><desc id="desc">A humorous editorial illustration. An enthusiastic robot produces an avalanche of code pages onto a conveyor belt; a thoughtful developer inspects the output with a magnifying glass, stopping a flawed item and approving only a few. A warm light falls on human judgment.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf3"/><stop offset="1" stop-color="#d9e8e9"/></linearGradient>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#092438"/><stop offset="1" stop-color="#0c3449"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
<symbol id="sheet" viewBox="0 0 130 170"><path d="M13 6H87L119 37V160H13Z" fill="url(#paper)" stroke="#6f99a2" stroke-width="3"/><path d="M87 6V37H119" fill="#b7d0d3" stroke="#6f99a2" stroke-width="3"/><path d="M30 58H102M30 75H91M30 92H101M30 109H84M30 126H101" stroke="#90b9c1" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="1350" height="760" rx="28" fill="url(#night)"/>
<path d="M0 571H1350V760H0Z" fill="#061a29"/>
<path d="M0 571H1350" stroke="#dfb874" stroke-opacity=".35" stroke-width="3"/>
<!-- robot and busy output -->
<circle cx="255" cy="294" r="206" fill="#5da3b5" opacity=".09"/>
<path d="M145 325l-53 87 45 41M361 325l53 87 -45 41" stroke="#54a7bd" stroke-width="26" stroke-linecap="round" fill="none"/>
<rect x="143" y="200" width="220" height="171" rx="35" fill="#2b697e" stroke="#86cfdb" stroke-width="6"/>
<rect x="170" y="224" width="166" height="113" rx="22" fill="#09283b"/>
<ellipse cx="219" cy="267" rx="14" ry="17" fill="#e4c17e"/><ellipse cx="291" cy="267" rx="14" ry="17" fill="#e4c17e"/>
<path d="M211 298Q253 330 298 298" stroke="#98dce5" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M254 201V165" stroke="#87cbd6" stroke-width="8"/><circle cx="254" cy="147" r="16" fill="#e6bb75"/>
<path d="M192 373v67h36v-67M282 373v67h36v-67" fill="#2b697e"/>
<g opacity=".95">
<use href="#sheet" x="391" y="97" width="110" height="144" transform="rotate(-14 440 169)"/>
<use href="#sheet" x="496" y="159" width="107" height="137" transform="rotate(15 549 228)"/>
<use href="#sheet" x="368" y="297" width="102" height="129" transform="rotate(-27 419 361)"/>
<use href="#sheet" x="497" y="347" width="110" height="145" transform="rotate(12 550 420)"/>
<use href="#sheet" x="616" y="249" width="109" height="143" transform="rotate(-12 670 320)"/>
</g>
<g fill="none" stroke="#67c0cf" stroke-width="4" stroke-dasharray="7 11" opacity=".7"><path d="M366 263Q439 191 490 193"/><path d="M364 312Q481 334 570 401"/></g>
<!-- conveyor -->
<path d="M75 540H1270V612H75Z" fill="#1b5063" stroke="#6c9ead" stroke-width="5"/>
<g fill="#0b2c40" stroke="#54899c" stroke-width="3"><circle cx="123" cy="577" r="18"/><circle cx="227" cy="577" r="18"/><circle cx="331" cy="577" r="18"/><circle cx="435" cy="577" r="18"/><circle cx="539" cy="577" r="18"/><circle cx="643" cy="577" r="18"/><circle cx="747" cy="577" r="18"/><circle cx="851" cy="577" r="18"/><circle cx="955" cy="577" r="18"/><circle cx="1059" cy="577" r="18"/><circle cx="1163" cy="577" r="18"/></g>
<path d="M94 539H1280" stroke="#caa05d" stroke-width="8"/>
<!-- human -->
<circle cx="1011" cy="162" r="144" fill="#ebc888" opacity=".12" filter="url(#glow)"/>
<circle cx="1011" cy="174" r="51" fill="#dba97b"/>
<path d="M962 166Q967 102 1028 118Q1064 129 1057 177Q1045 161 1033 139Q1001 154 962 166" fill="#123043"/>
<path d="M939 251Q994 218 1072 245L1135 487H897Z" fill="#d1aa70"/>
<path d="M951 481L941 539M1060 482L1077 539" stroke="#263e4c" stroke-width="35" stroke-linecap="round"/>
<path d="M928 268L851 395M1090 272L1160 368" stroke="#dca979" stroke-width="24" stroke-linecap="round"/>
<!-- magnifying glass -->
<circle cx="830" cy="402" r="61" fill="#98dfe8" fill-opacity=".16" stroke="#e9c37f" stroke-width="11"/>
<path d="M787 446L734 498" stroke="#e9c37f" stroke-width="15" stroke-linecap="round"/>
<path d="M807 401l22 21 29 -39" stroke="#f1d49e" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- warning sheets -->
<g><use href="#sheet" x="692" y="454" width="82" height="106"/><circle cx="743" cy="511" r="23" fill="#e2b471"/><path d="M743 497v20" stroke="#50351d" stroke-width="6" stroke-linecap="round"/><circle cx="743" cy="526" r="3" fill="#50351d"/></g>
<g><use href="#sheet" x="1113" y="441" width="81" height="107"/><path d="M1137 501l15 15 27 -28" fill="none" stroke="#379489" stroke-width="9" stroke-linecap="round"/></g>
<!-- visual narrative panels at bottom -->
<g font-family="Arial,Helvetica,sans-serif">
<text x="255" y="679" fill="#a8d9e2" font-size="28" font-weight="700" text-anchor="middle">MORE OUTPUT</text>
<text x="1013" y="679" fill="#edca8d" font-size="28" font-weight="700" text-anchor="middle">BETTER JUDGMENT</text>
<text x="666" y="680" fill="#d8e7e9" font-size="20" text-anchor="middle">does not automatically mean</text>
</g>
<path d="M389 668H500M829 668H907" stroke="#e9c27b" opacity=".7" stroke-width="3"/>
</svg>