name: Men's Health Compass v2.1 real-browser QA
on:
  pull_request:
    paths:
      - 'health/**'
      - '.github/workflows/health-v21-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check site with desktop and mobile Chromium
        run: node health/qa-v21-browser.mjs
      - name: Audit external primary-source URLs
        if: always()
        run: node health/check-v21-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mhc-v21-browser-screenshots
          path: health/qa-screenshots/
          retention-days: 14
