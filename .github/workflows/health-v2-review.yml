name: Health Compass v2 review
on:
  pull_request:
    paths:
      - 'health/**'
      - 'sandbox/mhc-v2-review/**'
      - '.github/workflows/health-v2-review.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Health site hierarchy
        run: node health/check-hierarchy.mjs
      - name: v2 pages and links
        run: node health/check-v2.mjs
      - name: V2.6 recovery compass and PDF
        run: node health/check-v26.mjs
      - name: Render and inspect printable recovery PDF
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          fi
          pdfinfo health/assets/Prostate_Surgery_Recovery_Compass_V2.6.pdf | grep -E '^Pages:[[:space:]]+4'
          mkdir -p health/qa-screenshots/v26-pdf
          pdftoppm -f 1 -l 4 -scale-to 840 -png -r 96 health/assets/Prostate_Surgery_Recovery_Compass_V2.6.pdf health/qa-screenshots/v26-pdf/recovery
          ls -l health/qa-screenshots/v26-pdf/*.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mhc-v26-pdf-render-proof
          path: health/qa-screenshots/v26-pdf/
          retention-days: 14
      - name: Generated pages are current
        run: |
          node health/build-v2.mjs
          git diff --exit-code -- health/prostate
