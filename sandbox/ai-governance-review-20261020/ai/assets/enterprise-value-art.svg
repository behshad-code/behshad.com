<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">Connected enterprise: technology, people, risk and value</title>
<desc id="desc">An original nocturnal architectural landscape with illuminated interconnected systems converging on a warm-gold center. Turquoise and gold routes suggest people, data, governance and measurable enterprise outcomes.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03131f"/><stop offset=".42" stop-color="#0c2b43"/><stop offset="1" stop-color="#0d4055"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d6780" stop-opacity=".66"/><stop offset="1" stop-color="#062137" stop-opacity=".09"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6fd5df" stop-opacity="0"/><stop offset=".53" stop-color="#67d9e7" stop-opacity=".81"/><stop offset="1" stop-color="#e5ba6c" stop-opacity=".83"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#e7bf78" stop-opacity=".35"/><stop offset=".43" stop-color="#41b5c8" stop-opacity=".14"/><stop offset="1" stop-color="#061c2a" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="windows" width="22" height="27" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="4" height="8" rx="1" fill="#9cdae1" opacity=".43"/></pattern>
