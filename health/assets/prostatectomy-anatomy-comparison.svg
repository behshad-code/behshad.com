<g font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#254e56">
<text x="80" y="157">Bladder</text><text x="80" y="348">Prostate</text><text x="80" y="411">Nerves</text><text x="80" y="488">Urethra</text>
<text x="1149" y="163" text-anchor="end">Bladder</text><text x="1149" y="324" text-anchor="end">Reconnection</text><text x="1149" y="411" text-anchor="end">Nearby nerves</text><text x="1149" y="475" text-anchor="end">Urethra</text>
</g>
<rect x="45" y="548" width="1130" height="31" rx="8" fill="#e9f3ef"/>
<text x="610" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#476d70">Simplified educational schematic, not to scale. Cancer location and the operative approach affect nerve preservation and recovery.</text>
</svg>