<path d="M390 295 C408 338 407 381 387 426" stroke="#d3a13f" stroke-width="8" fill="none" stroke-linecap="round"/>
<!-- after bladder to urethra -->
<path d="M918 287 L918 494" stroke="#257a8c" stroke-width="24" fill="none" stroke-linecap="round"/>
<path d="M918 287 L918 494" stroke="#e3f7f0" stroke-width="9" fill="none" stroke-linecap="round"/>
<ellipse cx="918" cy="303" rx="30" ry="12" fill="#d8efe5" stroke="#138575" stroke-width="5"/>
<path d="M895 305 l-9 12 M907 311 l-3 12 M919 315 v12 M931 311 l3 12 M943 305 l9 12" stroke="#0d8174" stroke-width="3"/>
