<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 338" role="img" aria-labelledby="roadtitle roaddesc"><title id="roadtitle">Seven stages of radical prostatectomy recovery</title><desc id="roaddesc">Illustrated stages from preparation before surgery, through early healing, catheter removal and urinary adjustment, return to routines, rehabilitation, progress review and life beyond year one.</desc><defs><linearGradient id="land" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e6f5f0"/><stop offset="1" stop-color="#f6fbf9"/></linearGradient></defs><rect width="1180" height="338" rx="22" fill="url(#land)"/><path d="M0 120Q150 68 284 119T570 119T865 111T1180 115V0H0Z" fill="#d8ece6" opacity=".9"/><path d="M22 158H1156" fill="none" stroke="#b0d9cd" stroke-width="8" stroke-linecap="round"/><g><line x1="92" y1="197" x2="92" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="92" cy="158" r="40" fill="#0f6870" stroke="#fff" stroke-width="8"/><g transform="translate(92 158)"><rect x="-15" y="-17" width="30" height="36" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="-7" y="-22" width="14" height="7" rx="2" fill="#fff"/><path d="M-8 -5l3 3 5-6M-8 6l3 3 5-6M6 -4h6M6 8h6" fill="none" stroke="#fff" stroke-width="2.5"/></g><text x="92" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">BEFORE</text><text x="92" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Preparation</text><text x="92" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 01</text></g><g><line x1="258" y1="197" x2="258" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="258" cy="158" r="40" fill="#1c8981" stroke="#fff" stroke-width="8"/><g transform="translate(258 158)"><path d="M-20 13H20M-18 12V-15M18 12V0H-18M-13-2V-12H0V-2M-18 0H18" stroke="#fff" stroke-width="3" fill="none"/></g><text x="258" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">DAYS 0-14</text><text x="258" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Early healing</text><text x="258" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 02</text></g><g><line x1="424" y1="197" x2="424" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="424" cy="158" r="40" fill="#0f6870" stroke="#fff" stroke-width="8"/><g transform="translate(424 158)"><path d="M0 -21C-6-11-15 0-15 8a15 15 0 0 0 30 0c0-8-9-19-15-29Z" stroke="#fff" stroke-width="3" fill="none"/><path d="M-7 8a7 7 0 0 0 7 7" stroke="#fff" stroke-width="2" fill="none"/></g><text x="424" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">WEEKS 2-6</text><text x="424" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Urinary adjustment</text><text x="424" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 03</text></g><g><line x1="590" y1="197" x2="590" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="590" cy="158" r="40" fill="#1c8981" stroke="#fff" stroke-width="8"/><g transform="translate(590 158)"><path d="M-21 8C-12 5-9 1-7-9L1-6C4 2 11 6 22 6v8H-21Z" stroke="#fff" stroke-width="3" stroke-linejoin="round" fill="none"/><path d="M-8 5L-1 5" stroke="#fff" stroke-width="2"/></g><text x="590" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">MONTHS 2-3</text><text x="590" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Return to routine</text><text x="590" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 04</text></g><g><line x1="756" y1="197" x2="756" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="756" cy="158" r="40" fill="#0f6870" stroke="#fff" stroke-width="8"/><g transform="translate(756 158)"><path d="M0 16C-17 1-22-6-16-15C-9-24-1-15 0-13C2-15 10-24 17-15C25-6 17 3 0 16Z" stroke="#fff" stroke-width="3" fill="none"/></g><text x="756" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">MONTHS 3-6</text><text x="756" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Functional recovery</text><text x="756" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 05</text></g><g><line x1="922" y1="197" x2="922" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="922" cy="158" r="40" fill="#1c8981" stroke="#fff" stroke-width="8"/><g transform="translate(922 158)"><rect x="-19" y="-17" width="38" height="34" rx="3" fill="none" stroke="#fff" stroke-width="3"/><path d="M-19-8H19M-8-23V-12M9-23V-12" stroke="#fff" stroke-width="3"/><path d="M-10 1h6M3 1h6M-10 10h6" stroke="#fff" stroke-width="3"/></g><text x="922" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">MONTHS 6-12</text><text x="922" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Review progress</text><text x="922" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 06</text></g><g><line x1="1088" y1="197" x2="1088" y2="227" stroke="#6db4a8" stroke-width="3"/><circle cx="1088" cy="158" r="40" fill="#0f6870" stroke="#fff" stroke-width="8"/><g transform="translate(1088 158)"><path d="M-17 17C-24-11-1-21 20-20C21 8 8 20-17 17Z" fill="none" stroke="#fff" stroke-width="3"/><path d="M-17 17C-5 3 4-4 19-13" fill="none" stroke="#fff" stroke-width="3"/></g><text x="1088" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#17726d">YEAR 1+</text><text x="1088" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#133c48">Long-term living</text><text x="1088" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#637f80">Phase 07</text></g><text x="590" y="318" text-anchor="middle" fill="#4d7175" font-family="Arial,sans-serif" font-size="16">Illustrative stages, not fixed medical milestones. Different functions recover at different speeds.</text></svg>